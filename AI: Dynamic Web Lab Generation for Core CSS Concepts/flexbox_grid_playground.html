<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flexbox and Grid Playground</title>
  <style>
    #container { display: flex; border: 2px solid black; min-height: 200px; padding: 10px; }
    .item { background: coral; margin: 5px; padding: 20px; color: white; font-weight: bold; }
  </style>
</head>
<body>
  <div class="controls">
    <label>Display:
      <select id="disp">
        <option value="flex">flex</option>
        <option value="grid">grid</option>
        <option value="block">block</option>
      </select>
    </label>
    <label>Flex Direction:
      <select id="fdir">
        <option value="row">row</option>
        <option value="column">column</option>
      </select>
    </label>
  </div>
  <div id="container">
    <div class="item">1</div><div class="item">2</div><div class="item">3</div><div class="item">4</div><div class="item">5</div>
  </div>
  <script>
    const c = document.getElementById('container');
    document.getElementById('disp').onchange = (e) => c.style.display = e.target.value;
    document.getElementById('fdir').onchange = (e) => c.style.flexDirection = e.target.value;
  </script>
</body>
</html>
