<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Box Model Lab</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #box1 { background: lightblue; border: 2px solid blue; padding: 10px; margin: 10px; width: 200px; background-clip: content-box; }
    #box2 { background: lightgreen; border: 2px solid green; padding: 10px; margin: 10px; width: 200px; }
    .controls { margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="controls">
    <label>Padding: <input type="range" id="pad" min="0" max="50" value="10"></label>
    <label>Margin: <input type="range" id="mar" min="0" max="50" value="10"></label>
    <label>Border: <input type="range" id="bor" min="0" max="20" value="2"></label>
    <label>Display: 
      <select id="disp">
        <option value="block">block</option>
        <option value="inline-block">inline-block</option>
        <option value="inline">inline</option>
      </select>
    </label>
  </div>
  <div id="box1">Box 1</div>
  <div id="box2">Box 2</div>
  <script>
    const b1 = document.getElementById('box1');
    document.getElementById('pad').oninput = (e) => b1.style.padding = e.target.value + 'px';
    document.getElementById('mar').oninput = (e) => b1.style.margin = e.target.value + 'px';
    document.getElementById('bor').oninput = (e) => b1.style.borderWidth = e.target.value + 'px';
    document.getElementById('disp').onchange = (e) => b1.style.display = e.target.value;
  </script>
</body>
</html>
